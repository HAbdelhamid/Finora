<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-labelledby="title desc">
<title id="title">Finora — Your financial command center</title>
<desc id="desc">Finora branding in emerald and midnight colors, with stylized dashboard cards and an abstract cash-flow chart. Decorative illustration, not actual account data.</desc>
<defs>
 <linearGradient id="background" x1="80" y1="20" x2="1140" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#091f26"/><stop offset=".58" stop-color="#0d3e38"/><stop offset="1" stop-color="#0b282c"/></linearGradient>
