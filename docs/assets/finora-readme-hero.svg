 <linearGradient id="area" x1="830" y1="182" x2="820" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#48d3a0" stop-opacity=".34"/><stop offset="1" stop-color="#48d3a0" stop-opacity="0"/></linearGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#acffdb" opacity=".08"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#031412" flood-opacity=".5"/></filter>
