name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Prevent React hook-order regressions
        run: npx eslint --no-config-lookup --parser @typescript-eslint/parser --plugin react-hooks --rule "react-hooks/rules-of-hooks:error" app/app/page.tsx
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
